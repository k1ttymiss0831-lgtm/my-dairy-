<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4"><title>日记 · 私人手稿</title>
<style>
:root{--bg:#f3f1eb;--paper:#fff;--ink:#171717;--muted:#666;--line:#d8d6ce;--soft:#e9e6de;--accent:#3457d5;--danger:#a32632}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;line-height:1.55}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #777;outline-offset:2px}.app{max-width:980px;margin:0 auto;padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px;border-bottom:1px solid var(--line);gap:12px}.brand{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}.brand strong{display:block;font-size:23px;letter-spacing:.03em;color:var(--ink);font-weight:550}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 13px;border-radius:9px;font-size:14px}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.danger{color:var(--danger)}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;padding-top:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.panel-title{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:0 0 14px;text-transform:uppercase}.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.month-head strong{font-size:15px}.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:white;font-size:18px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.week span{font-size:11px;color:var(--muted);padding:6px 0}.day{aspect-ratio:1;border:0;background:transparent;border-radius:9px;font-size:13px;position:relative;color:var(--ink)}.day.muted{color:#c0c0ba}.day.today{box-shadow:inset 0 0 0 1px #999}.day.selected{background:var(--accent);color:white;font-weight:700}.day.has-entry:after{content:"";position:absolute;bottom:4px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:currentColor}.day.selected.has-entry:after{background:white}.stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.stat strong{font-size:26px;font-weight:500}.stat span{font-size:12px;color:var(--muted)}.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:white}.mainhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.12em}.date-title{font-size:28px;font-weight:650;letter-spacing:-.04em;margin:3px 0 0}.entry-card{background:var(--paper);border:1px solid #d2cfc5;border-radius:16px;padding:22px;box-shadow:0 5px 20px rgba(28,25,18,.045)}.field{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:12px 0;color:var(--ink)}.field:focus{outline:none;border-color:#777}.title-input{font-size:21px;font-weight:600;margin-bottom:4px}.body-input{width:100%;min-height:300px;resize:vertical;border:0;background:transparent;padding:14px 0 18px;line-height:1.9;font-size:17px;color:var(--ink);outline:none}.body-input::placeholder,.field::placeholder{color:#aaa}.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;position:relative}.moods{display:flex;gap:6px;flex-wrap:wrap}.mood{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;min-height:40px;font-size:14px;line-height:1.3;color:#333;touch-action:manipulation;-webkit-appearance:none;appearance:none;position:relative;z-index:2;pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none}.mood.active{background:var(--accent);color:white;border-color:var(--accent);font-weight:600}.photos{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.photo-wrap{position:relative;width:100px;height:100px}.photo-wrap img{width:100%;height:100%;object-fit:cover;border-radius:9px;border:1px solid var(--line)}.photo-remove{position:absolute;right:-7px;top:-7px;border:0;border-radius:50%;width:25px;height:25px;background:#222;color:white}.below{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}.saved{font-size:12px;color:var(--muted)}.results{display:none;margin-bottom:18px}.result-item{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.result-item:last-child{border-bottom:0}.result-item strong{display:block;font-weight:550}.result-item small{color:var(--muted)}.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:14px}.notice{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}.hide{display:none!important}footer{text-align:center;color:#999;font-size:11px;letter-spacing:.08em;padding:28px 0 0}
@media(max-width:700px){.app{padding-left:13px;padding-right:13px}.layout{grid-template-columns:1fr;gap:6px;padding-top:16px}.side{display:grid;grid-template-columns:1fr;gap:0}.calendar-panel{padding:14px}.day{font-size:12px}.entry-card{padding:16px}.body-input{min-height:260px}.date-title{font-size:24px}.top{padding-top:18px}.brand strong{font-size:21px}.top-actions .btn{padding:8px 10px}.mainhead{margin-top:12px}}
</style>
<link rel="icon" type="image/png" href="dogchiken-icon.PNG">
<link rel="apple-touch-icon" href="dogchiken-icon.PNG">
</head>
<body><div class="app">
<header class="top"><div class="brand">A PRIVATE JOURNAL<strong>私人手稿 / Diary</strong></div><div class="top-actions"><button class="btn" id="exportBtn">导出备份</button><button class="btn" id="importBtn">导入备份</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></header>
<div class="layout"><aside class="side">
<section class="panel calendar-panel"><div class="panel-title">日历 / Calendar</div><div class="month-head"><button class="icon-btn" id="prevMonth" aria-label="上个月">‹</button><strong id="monthLabel"></strong><button class="icon-btn" id="nextMonth" aria-label="下个月">›</button></div><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="calendar" id="calendar"></div><div class="notice">有小圆点的日期，代表那天留下过记录。</div></section>
<section class="panel"><div class="panel-title">留存 / Archive</div><div class="stat"><strong id="entryCount">0</strong><span>篇日记</span></div><div class="stat"><strong id="streakCount">0</strong><span>天有记录（总计）</span></div></section>
<section class="panel"><div class="panel-title">寻找 / Search</div><input class="search" id="searchInput" placeholder="搜索标题、正文或心情…"><div id="searchResults" class="results"></div></section>
</aside>
<main><div class="mainhead"><div><div class="eyebrow">✦ 留给自己的时间</div><div style="display:flex;align-items:center;gap:8px"><button class="icon-btn" id="prevDay" aria-label="前一天">‹</button><div><h1 class="date-title" id="dateTitle"></h1><div class="eyebrow" id="dateEyebrow" style="letter-spacing:.02em;margin-top:2px"></div></div><button class="icon-btn" id="nextDay" aria-label="后一天">›</button></div></div><button class="btn primary" id="newBtn">今天</button></div>
<section class="entry-card"><input class="field title-input" id="entryTitle" maxlength="120" placeholder="标题（可不写）" aria-label="日记标题"><textarea class="body-input" id="entryBody" placeholder="今天发生了什么？&#10;想到哪，就写到哪……" aria-label="日记正文"></textarea>
<div class="meta-row"><div><div class="eyebrow" style="margin-bottom:8px">今天的心情</div><div class="moods" id="moods"><button type="button" class="mood" data-mood="平静" aria-pressed="false">😌 平静</button><button type="button" class="mood" data-mood="开心" aria-pressed="false">✨ 开心</button><button type="button" class="mood" data-mood="低落" aria-pressed="false">🌧️ 低落</button><button type="button" class="mood" data-mood="焦虑" aria-pressed="false">🫧 焦虑</button><button type="button" class="mood" data-mood="疲惫" aria-pressed="false">🌙 疲惫</button><button type="button" class="mood" data-mood="复杂" aria-pressed="false">🌀 复杂</button></div></div><div><label class="btn" for="photoInput">＋ 插入照片</label><input type="file" id="photoInput" accept="image/*" multiple hidden></div></div>
<div class="photos" id="photos"></div><div class="below"><span class="saved" id="savedStatus">自动保存到当前浏览器</span><div style="display:flex;gap:8px"><button class="btn danger" id="deleteBtn">删除此篇</button><button class="btn primary" id="saveBtn">保存日记</button></div></div></section>
<p class="notice">自动保存 · 记得偶尔导出备份。此版本没有云同步或密码加密。</p></main></div><footer>WRITE FOR YOURSELF · ONLY YOU KNOW THE WHOLE STORY</footer></div>
<script>
(()=>{'use strict';const KEY='private_journal_entries_v1';const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let entries=load(),selected=today(),view=new Date(),currentMood='',currentPhotos=[],timer=null,dirty=false;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return {}}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries));$('savedStatus').textContent='已保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});dirty=false;renderCalendar();renderStats();return true}catch(e){$('savedStatus').textContent='保存失败：存储空间可能已满，请导出备份或减少照片';return false}}
function blank(){return {title:'',body:'',mood:'',photos:[],updated:new Date().toISOString()}}function getEntry(){return entries[selected]||blank()}function fmtDate(s){const [y,m,d]=s.split('-').map(Number);return `${m}月${d}日`}function dayName(s){const [y,m,d]=s.split('-').map(Number);return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][new Date(y,m-1,d).getDay()]}
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth();$('monthLabel').textContent=`${y}年 ${m+1}月`;const first=(new Date(y,m,1).getDay()+6)%7;const count=new Date(y,m+1,0).getDate();let html='';for(let i=0;i<first;i++){const prevCount=new Date(y,m,0).getDate();const n=prevCount-first+i+1;html+=`<button class="day muted" data-date="${dateOf(y,m-1,n)}">${n}</button>`}for(let n=1;n<=count;n++){const s=dateOf(y,m,n),cl=['day',s===selected?'selected':'',s===today()?'today':'',entries[s]?'has-entry':''].filter(Boolean).join(' ');html+=`<button class="${cl}" data-date="${s}">${n}</button>`}const used=first+count;for(let n=1;used%7&&n<=7-used%7;n++)html+=`<button class="day muted" data-date="${dateOf(y,m+1,n)}">${n}</button>`;$('calendar').innerHTML=html;$('calendar').querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>selectDate(b.dataset.date)))}function dateOf(y,m,d){const dt=new Date(y,m,d);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function renderStats(){$('entryCount').textContent=Object.keys(entries).length;$('streakCount').textContent=Object.keys(entries).length}
function selectDate(s){if(dirty&&!saveCurrent(false))return;selected=s;const [y,m]=s.split('-').map(Number);view=new Date(y,m-1,1);renderCalendar();renderEntry()}
function renderEntry(){const e=getEntry();$('dateTitle').textContent=fmtDate(selected);$('dateEyebrow').textContent=`${dayName(selected)}${selected===today()?' · 今天':''}`;$('entryTitle').value=e.title||'';$('entryBody').value=e.body||'';currentMood=e.mood||'';currentPhotos=Array.isArray(e.photos)?[...e.photos]:[];renderMoods();renderPhotos();$('savedStatus').textContent=entries[selected]?'已保存的日记':'新的一页 · 自动保存到当前浏览器';dirty=false}
function renderMoods(){$('moods').querySelectorAll('[data-mood]').forEach(b=>{const active=b.dataset.mood===currentMood;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}function renderPhotos(){$('photos').innerHTML='';currentPhotos.forEach((src,i)=>{const w=document.createElement('div');w.className='photo-wrap';const img=document.createElement('img');img.src=src;img.alt='日记照片';const b=document.createElement('button');b.className='photo-remove';b.textContent='×';b.setAttribute('aria-label','移除照片');b.onclick=()=>{currentPhotos.splice(i,1);markDirty();renderPhotos()};w.append(img,b);$('photos').append(w)})}
function saveCurrent(showAlert=true){const title=$('entryTitle').value.trim(),body=$('entryBody').value.trim();if(!title&&!body&&!currentMood&&!currentPhotos.length){if(entries[selected])delete entries[selected];persist();dirty=false;return true}entries[selected]={title,body,mood:currentMood,photos:currentPhotos,updated:new Date().toISOString()};const ok=persist();if(showAlert&&ok)$('savedStatus').textContent='已保存';return ok}
function markDirty(){dirty=true;$('savedStatus').textContent='正在保存…';clearTimeout(timer);timer=setTimeout(()=>saveCurrent(false),500)}
$('entryTitle').addEventListener('input',markDirty);$('entryBody').addEventListener('input',markDirty);function chooseMood(b){if(!b||!b.dataset||!b.dataset.mood)return;currentMood=currentMood===b.dataset.mood?'':b.dataset.mood;renderMoods();markDirty()}
$('moods').querySelectorAll('[data-mood]').forEach(b=>{b.type='button';b.setAttribute('role','button');b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>chooseMood(b),{passive:true});b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseMood(b)}})});$('saveBtn').onclick=()=>{saveCurrent();renderCalendar();renderStats()};$('newBtn').onclick=()=>{selectDate(today());$('entryBody').focus()};$('prevDay').onclick=()=>{const [y,m,d]=selected.split('-').map(Number);selectDate(dateOf(y,m-1,d-1))};$('nextDay').onclick=()=>{const [y,m,d]=selected.split('-').map(Number);selectDate(dateOf(y,m-1,d+1))};$('deleteBtn').onclick=()=>{if(!entries[selected]&&!$('entryTitle').value&&!$('entryBody').value&&!currentPhotos.length&&!currentMood){alert('这一页还没有内容。');return}if(confirm(`确定删除 ${fmtDate(selected)} 的日记吗？此操作无法撤销，请先备份。`)){delete entries[selected];currentMood='';currentPhotos=[];persist();renderEntry();renderCalendar();renderStats()}};$('prevMonth').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar()};
$('photoInput').addEventListener('change',async e=>{const files=Array.from(e.target.files||[]);for(const f of files){if(!f.type.startsWith('image/'))continue;try{const data=await compressImage(f);currentPhotos.push(data)}catch(err){alert('有一张照片无法读取，请换一张试试。')}}renderPhotos();markDirty();e.target.value=''});function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
$('searchInput').addEventListener('input',()=>{const q=$('searchInput').value.trim().toLowerCase(),box=$('searchResults');if(!q){box.style.display='none';box.innerHTML='';return}const found=Object.entries(entries).filter(([date,e])=>[date,e.title,e.body,e.mood].join(' ').toLowerCase().includes(q)).sort((a,b)=>b[0].localeCompare(a[0]));box.style.display='block';box.innerHTML=found.length?found.map(([date,e])=>`<div class="result-item" data-result="${date}"><strong>${escapeHtml(e.title||'无标题')}</strong><small>${date} · ${escapeHtml(e.mood||'未记录心情')} · ${(e.body||'').length} 字</small><div>${escapeHtml((e.body||'').slice(0,75))}${(e.body||'').length>75?'…':''}</div></div>`).join(''):'<div class="empty">没有找到相关日记</div>';box.querySelectorAll('[data-result]').forEach(el=>el.onclick=()=>{selectDate(el.dataset.result);$('searchInput').value='';box.style.display='none';window.scrollTo({top:0,behavior:'smooth'})})});function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('exportBtn').onclick=()=>{if(dirty)saveCurrent(false);const blob=new Blob([JSON.stringify({app:'私人手稿',version:1,exportedAt:new Date().toISOString(),entries},null,2)],{type:'application/json'});downloadBlob(blob,`私人日记备份-${today()}.json`)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text()),incoming=obj.entries||obj;if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw new Error('格式不正确');if(!confirm('导入会将备份中的日记合并到当前日记本；同一天已有的内容会被备份覆盖。建议先导出当前备份。继续吗？'))return;Object.entries(incoming).forEach(([date,entry])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&entry&&typeof entry==='object')entries[date]=entry});persist();renderEntry();alert('导入完成。')}catch(err){alert('无法导入：请确认这是本应用导出的 JSON 备份。')}finally{e.target.value=''}});function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}window.addEventListener('beforeunload',e=>{if(dirty){saveCurrent(false);e.preventDefault();e.returnValue=''}});renderCalendar();renderStats();renderEntry();
})();
</script></body></html>
